name: conduit_web
description: >-
  The Conduit front end in Dart, compiled to JavaScript, talking to the server
  through the generated ConduitApi client.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  conduit_shared: any
  dio: ^5.9.2
  dio_web_adapter: ^2.1.0
  markdown: ^7.3.0
  web: ^1.1.0

dev_dependencies:
  test: ^1.26.0
